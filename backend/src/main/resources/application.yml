server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: he-thong-thi-online-v2
  data:
    mongodb:
      uri: ${MONGODB_URI}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_ENABLED:false}
    admin-username: ${SEED_ADMIN_USERNAME:admin}
    admin-email: ${SEED_ADMIN_EMAIL:admin@example.com}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    teacher-username: ${SEED_TEACHER_USERNAME:teacher}
    teacher-email: ${SEED_TEACHER_EMAIL:teacher@example.com}
    teacher-password: ${SEED_TEACHER_PASSWORD:}
    student-username: ${SEED_STUDENT_USERNAME:student}
    student-email: ${SEED_STUDENT_EMAIL:student@example.com}
    student-password: ${SEED_STUDENT_PASSWORD:}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:System Admin}
    admin-code: ${BOOTSTRAP_ADMIN_CODE:ADM-ROOT}
